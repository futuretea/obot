name: Build and Push Docker Image

permissions:
  id-token: write
  contents: read
  packages: write
  actions: read
  security-events: write

on:
  workflow_dispatch:
    inputs:
      base_image:
        description: Base builder image to use. Empty uses ghcr.io/<repo>/base:latest.
        required: false
      runtime_base_image:
        description: Runtime base image to use. Empty uses ghcr.io/<repo owner>/obot-runtime-base:latest. Use runtime-base to build it from this Dockerfile.
        required: false

env:
  BASE_IMAGE: ghcr.io/${{ github.repository }}/base:latest
  RUNTIME_BASE_IMAGE: ghcr.io/${{ github.repository_owner }}/obot-runtime-base:latest

jobs:
  oss-build:
    runs-on: ubuntu-22.04

    steps:
      - name: Free Disk Space
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: false
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: true

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push OSS Docker image
        uses: docker/build-push-action@v5
        id: build-and-push
        with:
          context: .
          push: true
          platforms: linux/amd64
          tags: |
            ghcr.io/${{ github.repository }}:${{ github.ref_name }}
          build-args: |
            BASE_IMAGE=${{ inputs.base_image || env.BASE_IMAGE }}
            RUNTIME_BASE_IMAGE=${{ inputs.runtime_base_image || env.RUNTIME_BASE_IMAGE }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Install Cosign
        uses: sigstore/cosign-installer@v3.8.1
        with:
          cosign-release: "v2.4.3"

      - name: Check install
        run: cosign version

      - name: Sign Images
        env:
          DIGEST: ${{ steps.build-and-push.outputs.digest }}
          TAGS: ghcr.io/${{ github.repository }}:${{ github.ref_name }}
        run: |
          images=""
          for tag in ${TAGS}; do
            images+="${tag}@${DIGEST} "
          done
          cosign sign --yes ${images}

      - name: Setup crane
        uses: imjasonh/setup-crane@v0.5

      - name: Copy OSS image to latest tag
        if: ${{ github.ref_type == 'tag' && !contains(github.ref_name, '-') }}
        run: |
          crane tag ghcr.io/${{ github.repository }}:${{ github.ref_name }} latest
