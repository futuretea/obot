# Local Keycloak for Obot auth-provider verification.
# Admin console: http://127.0.0.1:8180  (admin / admin)
# Issuer:        http://127.0.0.1:8180/realms/obot
services:
  keycloak:
    image: quay.io/keycloak/keycloak:26.3
    container_name: obot-keycloak
    command: ["start-dev", "--import-realm"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      KC_HOSTNAME: http://127.0.0.1:8180
      KC_HOSTNAME_STRICT: "false"
      KC_HTTP_ENABLED: "true"
    ports:
      - "8180:8080"
    volumes:
      - ./obot-realm.json:/opt/keycloak/data/import/obot-realm.json:ro
