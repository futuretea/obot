name: Build and Push Docker Image

permissions:
  id-token: write
  contents: read
  packages: write
  actions: read
  security-events: write

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Image tag for ghcr.io/futuretea/obot
        required: true
        default: latest
      providers_image:
        description: Providers image baked into Obot
        required: true
        default: ghcr.io/futuretea/obot-providers:latest

jobs:
  build:
    runs-on: depot-ubuntu-22.04

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          # Fetch tags and full commit history for branch builds.
          # This provides the VCS info required for `go build` to produce a binary that contains a
          # main module pseudo-version with a core segment relative to the most recent release tag
          # (e.g. vX.Y.(Z+1)-0.<ts>-<rev>).
          # Without the full history, branch builds generate versions like v0.0.0-<ts>-<rev>,
          # which can cause false positives in vulnerability scans.
          fetch-depth: ${{ case(github.ref_type == 'tag', 1, 0) }}

      - name: Setup Depot
        uses: depot/setup-action@v1

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ secrets.GHCR_USERNAME }}
          password: ${{ secrets.GHCR_TOKEN }}

      - name: Build and push Docker images
        uses: depot/build-push-action@v1
        id: build-and-push
        with:
          project: bbqjs4tj1g
          context: .
          push: true
          pull: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ghcr.io/${{ github.repository }}:${{ inputs.tag }}
            ghcr.io/${{ github.repository }}-enterprise:${{ inputs.tag }}
          build-args: |
            BASE_IMAGE=ghcr.io/obot-platform/obot/base:latest
            PROVIDERS_IMAGE=${{ inputs.providers_image }}

      - name: Install Cosign
        uses: sigstore/cosign-installer@v3.8.1
        with:
          cosign-release: "v2.4.3"
      - name: Check install!
        run: cosign version

      - name: Sign Images
        env:
          DIGEST: ${{ steps.build-and-push.outputs.digest }}
          TAGS: >-
            ghcr.io/${{ github.repository }}:${{ inputs.tag }}
            ghcr.io/${{ github.repository }}-enterprise:${{ inputs.tag }}
        run: |
          images=""
          for tag in ${TAGS}; do
            images+="${tag}@${DIGEST} "
          done
          cosign sign --yes ${images}

      - name: Setup crane
        uses: imjasonh/setup-crane@v0.5

      - name: Copy images to latest tag
        if: ${{ inputs.tag != 'latest' && !contains(inputs.tag, '-') }}
        run: |
          crane tag ghcr.io/${{ github.repository }}:${{ inputs.tag }} latest
          crane tag ghcr.io/${{ github.repository }}-enterprise:${{ inputs.tag }} latest

  image-scan:
    runs-on: depot-ubuntu-22.04
    needs: build

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Depot
        uses: depot/setup-action@v1

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ secrets.GHCR_USERNAME }}
          password: ${{ secrets.GHCR_TOKEN }}

      - name: Run Trivy
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1 # 0.35.0
        with:
          image-ref: ghcr.io/${{ github.repository }}:${{ inputs.tag }}
          skip-dirs: "**/venv"
          format: "sarif"
          output: "trivy-results.sarif"

      - name: Upload SARIF file
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy-results.sarif
