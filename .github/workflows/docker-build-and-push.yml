name: Build and Push Docker Image

permissions:
  id-token: write
  contents: read
  packages: write
  actions: write
  security-events: write

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Image tag for ghcr.io/futuretea/obot
        required: true
        default: latest
      providers_image:
        description: Providers image baked into Obot
        required: true
        default: ghcr.io/futuretea/obot-providers:latest

env:
  IMAGE: ghcr.io/${{ github.repository }}
  ENTERPRISE_IMAGE: ghcr.io/${{ github.repository }}-enterprise

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            platform: linux/amd64
            pair: linux-amd64
          - runner: ubuntu-24.04-arm
            platform: linux/arm64
            pair: linux-arm64
    runs-on: ${{ matrix.runner }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          # Full history on branch builds so `go build` can emit a module
          # pseudo-version relative to the latest release tag.
          fetch-depth: ${{ github.ref_type == 'tag' && 1 || 0 }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push by digest
        uses: docker/build-push-action@v6
        id: build
        with:
          context: .
          platforms: ${{ matrix.platform }}
          build-args: |
            BASE_IMAGE=ghcr.io/obot-platform/obot/base:latest
            PROVIDERS_IMAGE=${{ inputs.providers_image }}
          cache-from: type=gha,scope=${{ matrix.platform }}
          cache-to: type=gha,mode=max,scope=${{ matrix.platform }}
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true

      - name: Export digest
        run: |
          mkdir -p "${{ runner.temp }}/digests"
          digest="${{ steps.build.outputs.digest }}"
          touch "${{ runner.temp }}/digests/${digest#sha256:}"

      - name: Upload digest
        uses: actions/upload-artifact@v4
        with:
          name: digests-${{ matrix.pair }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download digests
        uses: actions/download-artifact@v4
        with:
          path: ${{ runner.temp }}/digests
          pattern: digests-*
          merge-multiple: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create manifest lists
        working-directory: ${{ runner.temp }}/digests
        env:
          TAG: ${{ inputs.tag }}
        run: |
          refs=""
          for digest in *; do
            refs+="${IMAGE}@sha256:${digest} "
          done
          docker buildx imagetools create \
            -t "${IMAGE}:${TAG}" \
            -t "${IMAGE}:latest" \
            ${refs}
          docker buildx imagetools create \
            -t "${ENTERPRISE_IMAGE}:${TAG}" \
            -t "${ENTERPRISE_IMAGE}:latest" \
            ${refs}

      - name: Install Cosign
        uses: sigstore/cosign-installer@v3.8.1
        with:
          cosign-release: "v2.4.3"

      - name: Setup crane
        uses: imjasonh/setup-crane@v0.5

      - name: Sign Images
        env:
          TAG: ${{ inputs.tag }}
        run: |
          cosign sign --yes \
            "${IMAGE}@$(crane digest "${IMAGE}:${TAG}")" \
            "${ENTERPRISE_IMAGE}@$(crane digest "${ENTERPRISE_IMAGE}:${TAG}")"

  image-scan:
    runs-on: ubuntu-latest
    needs: merge

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Run Trivy
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1 # 0.35.0
        with:
          image-ref: ghcr.io/${{ github.repository }}:${{ inputs.tag }}
          skip-dirs: "**/venv"
          format: "sarif"
          output: "trivy-results.sarif"

      - name: Upload SARIF file
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy-results.sarif
